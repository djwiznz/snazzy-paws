<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Photos of recent grooms and happy clients.">
  <title>Snazzy Paws Grooming — Gallery</title>
  <!-- A3: load W3.CSS framework; our stylesheet still controls the look -->
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">

      <nav class="site-nav" aria-label="Main">

        <!-- A3: mobile hamburger toggle (shown only on small screens) -->
        <button class="menu-toggle" aria-label="Toggle menu" aria-controls="mainMenu" aria-expanded="false"
          onclick="spToggleMenu(this)">
          ☰ Menu
        </button>

        <!-- A3: give the menu an id so we can toggle it -->
        <ul class="menu" id="mainMenu">
          <li><a href="index.html">Home</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a aria-current="page" href="gallery.html">Gallery</a></li>
          <li><a href="booking.html">Booking</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p><strong>Opening hours:</strong> Mon–Sat, 9:00 am – 5:00 pm</p>
      <!-- A3: link to new privacy page -->
      <p>&copy; 2025 Snazzy Paws Grooming • <a href="privacy.html">Privacy</a></p>
    </div>
  </footer>
  <script>
    /* A3: simple mobile menu toggle */
    function spToggleMenu(btn) {
      var m = document.getElementById('mainMenu');
      if (!m) return;
      var open = m.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
  </script>
</body>

</html>
