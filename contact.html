<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- A3: one-sentence summary for this page (helps SEO) -->
  <meta name="description" content="Find our location and contact details. Get in touch.">
  <title>Snazzy Paws Grooming — Contact</title>
  <!-- A3: load W3.CSS framework; our stylesheet still controls the look -->
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <nav class="site-nav" aria-label="Main">
        <a class="brand" href="index.html"><span aria-hidden="true">🐾</span> Snazzy Paws Grooming</a>

        <!-- A3: mobile hamburger toggle (shown only on small screens) -->
        <button class="menu-toggle" aria-label="Toggle menu" aria-controls="mainMenu" aria-expanded="false" onclick="spToggleMenu(this)">
          ☰ Menu
        </button>

        <!-- A3: give the menu an id so we can toggle it -->
        <ul class="menu" id="mainMenu">
          <li><a href="index.html">Home</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="booking.html">Booking</a></li>
          <li><a aria-current="page" href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
  
  <!-- A3: prove framework use without changing design -->
  <main id="main" class="container w3-container">
        <h1>Find us and get in touch</h1>

    <section class="map-wrap" aria-label="Map">
      <!-- A3: embedded Google Map for our real location -->
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d59996.89150095253!2d175.23659412954513!3d-37.785394939380055!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6d6d22142050ed0b%3A0x862cf49d62d3f56d!2sMetro%20Paws!5e0!3m2!1sen!2snz!4v1758939108396!5m2!1sen!2snz" 
      width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>

    <section>
      <h2>Send a message</h2>
      <form class="form" aria-describedby="contact-help" action="#" method="post" novalidate>
        <p id="contact-help" class="help">Forms are not connected. This is a demo submission.</p>

        <div class="form-row">
          <label for="name">Name <span class="req">*</span></label>
          <input id="name" name="name" type="text" required>
        </div>

        <div class="form-row">
          <label for="email">Email <span class="req">*</span></label>
          <input id="email" name="email" type="email" required>
        </div>

        <div class="form-row">
          <label for="phone">Phone <span class="req">*</span></label>
          <input id="phone" name="phone" type="tel" required>
        </div>

        <div class="form-row">
          <label for="comment">Comment <span class="req">*</span></label>
          <textarea id="comment" name="comment" rows="5" required></textarea>
        </div>

        <button class="btn" type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p><strong>Opening hours:</strong> Mon–Sat, 9:00 am – 5:00 pm</p>
      <!-- A3: link to new privacy page -->
      <p>&copy; 2025 Snazzy Paws Grooming • <a href="privacy.html">Privacy</a></p>
    </div>
  </footer>
<script>
  /* A3: simple mobile menu toggle */
  function spToggleMenu(btn) {
    var m = document.getElementById('mainMenu');
    if (!m) return;
    var open = m.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
</script>
</body>

</html>
